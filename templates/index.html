<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>

  <style>
    body {
      font-family: 'Segoe UI', Arial;
      margin: 0;
      padding: 10px;
      transition: 0.3s;
    }

    body.light {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    body.dark {
      background: #121212;
      color: white;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    body.dark .container {
      background: #1e1e1e;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h2 {
      text-align: center;
      margin: 15px 0;
    }

    .toggle {
      cursor: pointer;
      font-size: 18px;
    }

    /* 📱 FORM RESPONSIVO */
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    body.dark input {
      background: #333;
      color: white;
      border: none;
    }

    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* 📦 TAREFAS */
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      background: #f5f5f5;
    }

    body.dark .task {
      background: #2a2a2a;
    }

    .task.done {
      background: #d4edda;
    }

    .task.overdue {
      background: #f8d7da;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task.done .check {
      background: #28a745;
      color: white;
      border: none;
    }

    .text {
      display: flex;
      flex-direction: column;
    }

    .deadline {
      font-size: 12px;
      color: #666;
    }

    /* 🔘 BOTÕES GRANDES PRA TOQUE */
    .actions a {
      font-size: 20px;
      margin-left: 10px;
    }

    /* 📱 MELHORIAS MOBILE */
    @media (max-width: 500px) {
      body {
        padding: 5px;
      }

      .container {
        padding: 15px;
        border-radius: 12px;
      }

      h2 {
        font-size: 20px;
      }

      .task {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .actions {
        width: 100%;
        display: flex;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body class="light">

<div class="container">

  <div class="top">
    <a href="/logout">Sair</a>
    <span class="toggle" onclick="toggleTheme()">🌙</span>
  </div>

  <h2>📝 Tarefas</h2>

  <form method="POST" action="/add">
    <input name="title" placeholder="Nova tarefa..." required>
    <input type="date" name="deadline">
    <button>Adicionar</button>
  </form>

  {% for task in tasks %}
  <div class="task 
    {% if task.done %}done{% endif %}
    {% if task.deadline and not task.done and task.deadline < now %}overdue{% endif %}
  ">

    <div class="left">
      <div class="check">
        {% if task.done %}✔{% endif %}
      </div>

      <div class="text">
        <span>{{ task.title }}</span>

        {% if task.deadline %}
        <span class="deadline">
          📅 {{ task.deadline.strftime('%d/%m/%Y') }}
        </span>
        {% endif %}
      </div>
    </div>

    <div class="actions">
  <a href="/edit/{{ task.id }}">✏️</a>
  <a href="/done/{{ task.id }}">✔</a>
  <a href="/delete/{{ task.id }}">❌</a>
</div>

  </div>
  {% endfor %}

</div>

<script>
function toggleTheme() {
  const body = document.body;

  if (body.classList.contains("light")) {
    body.classList.replace("light", "dark");
    localStorage.setItem("theme", "dark");
  } else {
    body.classList.replace("dark", "light");
    localStorage.setItem("theme", "light");
  }
}

window.onload = () => {
  const theme = localStorage.getItem("theme");
  if (theme === "dark") {
    document.body.classList.replace("light", "dark");
  }
};
</script>

</body>
</html>
