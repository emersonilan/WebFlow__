<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  padding:20px;
}

/* temas */
body.light {
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: #000;
}

body.dark {
  background:#121212;
  color:#e0e0e0;
}

/* container */
.container {
  background:white;
  padding:25px;
  border-radius:18px;
  max-width:520px;
  margin:auto;
}

body.dark .container {
  background:#1e1e1e;
}

/* header */
.header {
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* busca */
#search {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin:15px 0;
}

body.dark #search {
  background:#333;
  color:white;
  border:none;
}

/* filtros */
.filters {
  display:flex;
  gap:8px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.filter-btn {
  padding:8px 14px;
  border-radius:12px;
  border:1px solid transparent;
  cursor:pointer;
  background:#e0e0e0;
  color:#333;
  transition:0.2s;
}

.filter-btn:hover {
  background:#d6d6d6;
}

.filter-btn.active {
  background:#667eea;
  color:white;
}

body.dark .filter-btn {
  background:#2a2a2a;
  color:#ccc;
}

body.dark .filter-btn:hover {
  background:#3a3a3a;
}

body.dark .filter-btn.active {
  background:#667eea;
  color:white;
}

/* bloco adicionar tarefa */
.add-task {
  margin-bottom:25px;
}

/* inputs */
input {
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
}

body.dark input {
  background:#333;
  color:white;
  border:none;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#667eea;
  color:white;
  cursor:pointer;
}

/* progresso */
.progress {
  margin-bottom:20px;
}

.progress-bar {
  background:#ddd;
  height:10px;
  border-radius:10px;
}

.progress-fill {
  background:#667eea;
  height:100%;
  border-radius:10px;
}

/* tarefas */
.task {
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

.task:first-of-type {
  margin-top:10px;
}

body.dark .task {
  background:#2a2a2a;
  color:#fff;
}

/* concluída */
.task.done {
  background:#d4edda;
  color:#155724;
}

body.dark .task.done {
  background:#1b5e20;
  color:#e8f5e9;
  border-left:5px solid #4caf50;
}

/* atrasada */
.task.overdue {
  background:#f8d7da;
  color:#721c24;
}

body.dark .task.overdue {
  background:#4a1f1f;
  color:#ff8a80;
}

.task-text {
  display:block;
  margin-bottom:8px;
}

/* ações */
.actions {
  display:flex;
  gap:10px;
}

a {
  text-decoration:none;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <a href="/logout">Sair</a>
  <span onclick="toggleTheme()">🌙</span>
</div>

<h2>Tarefas</h2>

<!-- PROGRESSO -->
<div class="progress">
  <strong>{{ progress }}%</strong>
  <div class="progress-bar">
    <div class="progress-fill" style="width: {{ progress }}%;"></div>
  </div>
  <small>{{ done }} de {{ total }} concluídas</small>
</div>

<!-- BUSCA -->
<input type="text" id="search" placeholder="Buscar..." onkeyup="applyFilters()">

<!-- FILTROS -->
<div class="filters">
  <button class="filter-btn active" onclick="setFilter('all', event)">Todas</button>
  <button class="filter-btn" onclick="setFilter('pending', event)">Pendentes</button>
  <button class="filter-btn" onclick="setFilter('done', event)">Concluídas</button>
  <button class="filter-btn" onclick="setFilter('date', event)">Por data</button>
</div>

<!-- NOVA TAREFA -->
<div class="add-task">
  <form method="POST" action="/add">
    <input name="title" placeholder="Nova tarefa..." required>
    <input type="date" name="deadline">
    <button type="submit">+</button>
  </form>
</div>

<!-- LISTA -->
{% for task in tasks %}
<div class="task 
{% if task.done %}done{% endif %}
{% if task.deadline and not task.done and task.deadline < now %}overdue{% endif %}
"
data-done="{{ task.done }}"
data-date="{{ task.deadline.strftime('%Y-%m-%d') if task.deadline else '' }}"
>

<span class="task-text">
  {% if task.done %}✅{% endif %}
  {% if task.pinned %}📌{% endif %}
  {{ task.title }}
</span>

{% if task.deadline %}
<small>📅 {{ task.deadline.strftime('%d/%m/%Y') }}</small>
{% endif %}

<div class="actions">
  <a href="/pin/{{ task.id }}">📍</a>
  <a href="/edit/{{ task.id }}">✏️</a>
  <a href="/done/{{ task.id }}">✔</a>
  <a onclick="confirmDelete({{ task.id }})">❌</a>
</div>

</div>
{% endfor %}

</div>

<script>
let currentFilter = "all";

function setFilter(filter, event){
  currentFilter = filter;

  document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
  event.target.classList.add("active");

  applyFilters();
}

function applyFilters(){
  let search = document.getElementById("search").value.toLowerCase();
  let tasks = Array.from(document.querySelectorAll(".task"));

  tasks.forEach(task => {
    let text = task.innerText.toLowerCase();
    let done = task.dataset.done === "True";

    let matchSearch = text.includes(search);

    let matchFilter =
      currentFilter === "all" ||
      (currentFilter === "pending" && !done) ||
      (currentFilter === "done" && done);

    task.style.display = (matchSearch && matchFilter) ? "block" : "none";
  });

  if (currentFilter === "date") {
    let container = document.querySelector(".container");

    tasks.sort((a, b) => {
      let da = a.dataset.date || "9999-12-31";
      let db = b.dataset.date || "9999-12-31";
      return da.localeCompare(db);
    });

    tasks.forEach(t => container.appendChild(t));
  }
}

// tema
window.onload = function() {
  const theme = localStorage.getItem("theme") || "dark";
  document.body.classList.add(theme);
};

function toggleTheme(){
  const body = document.body;

  if (body.classList.contains("dark")) {
    body.classList.replace("dark","light");
    localStorage.setItem("theme","light");
  } else {
    body.classList.replace("light","dark");
    localStorage.setItem("theme","dark");
  }
}

// alerta
function confirmDelete(id){
  Swal.fire({
    title: 'Tem certeza?',
    icon: 'warning',
    showCancelButton: true
  }).then((result) => {
    if (result.isConfirmed) {
      window.location.href = '/delete/' + id;
    }
  });
}
</script>

</body>
</html>
