<!DOCTYPE html>
<html>
<head>
  <title>To-Do List</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    /* 🌞 MODO CLARO */
    body.light {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    /* 🌙 MODO ESCURO */
    body.dark {
      background: #121212;
      color: white;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    body.dark .container {
      background: #1e1e1e;
    }

    h1 {
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toggle {
      cursor: pointer;
      font-size: 14px;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    body.dark input {
      background: #333;
      color: white;
      border: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    /* 🧠 NOVO DESIGN DAS TAREFAS */
    .task {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f7f7f7;
      transition: 0.3s;
    }

    body.dark .task {
      background: #2a2a2a;
    }

    .task.done {
      background: #d4edda;
    }

    body.dark .task.done {
      background: #1f3d2b;
    }

    .task-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .task.done .check {
      background: #28a745;
      border: none;
      color: white;
    }

    .task.done span {
      color: #2e7d32;
    }

    body.dark .task.done span {
      color: #8bc34a;
    }

    .actions a {
      margin-left: 8px;
      text-decoration: none;
      font-size: 18px;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body class="light">

<div class="container">

  <div class="top-bar">
    <a href="/logout">Sair</a>
    <span class="toggle" onclick="toggleTheme()">🌙</span>
  </div>

  <h1>📝 Minhas Tarefas</h1>

  <form action="/add" method="POST">
    <input name="title" placeholder="Nova tarefa..." required>
    <button type="submit">+</button>
  </form>

  <ul>
    {% for task in tasks %}
      <li class="task {% if task.done %}done{% endif %}">

        <div class="task-text">
          <div class="check">
            {% if task.done %}✔{% endif %}
          </div>

          <span>{{ task.title }}</span>
        </div>

        <div class="actions">
          <a href="/done/{{ task.id }}">🔄</a>
          <a href="/delete/{{ task.id }}">❌</a>
        </div>

      </li>
    {% endfor %}
  </ul>

</div>

<script>
function toggleTheme() {
  const body = document.body;

  if (body.classList.contains("light")) {
    body.classList.remove("light");
    body.classList.add("dark");
    localStorage.setItem("theme", "dark");
  } else {
    body.classList.remove("dark");
    body.classList.add("light");
    localStorage.setItem("theme", "light");
  }
}

// carregar tema salvo
window.onload = () => {
  const theme = localStorage.getItem("theme");
  if (theme === "dark") {
    document.body.classList.remove("light");
    document.body.classList.add("dark");
  }
};
</script>

</body>
</html>
