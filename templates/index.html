<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  padding:20px;
}

/* temas */
body.light {
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: #000;
}

body.dark {
  background:#121212;
  color:#e0e0e0;
}

/* container */
.container {
  background:white;
  padding:25px;
  border-radius:18px;
  max-width:520px;
  margin:auto;
}

body.dark .container {
  background:#1e1e1e;
}

/* header */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

/* busca */
#search {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin:15px 0 20px 0;
  box-sizing:border-box;
}

body.dark #search {
  background:#333;
  color:white;
  border:none;
}

/* formulários */
form {
  margin-bottom:15px;
}

/* inputs */
input {
  padding:12px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-right:5px;
}

body.dark input {
  background:#333;
  color:white;
  border:none;
}

/* botões */
button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#667eea;
  color:white;
  cursor:pointer;
}

/* select */
select {
  padding:10px;
  border-radius:10px;
  margin-left:10px;
}

/* progresso */
.progress-container {
  margin-bottom:20px;
}

.progress-bar-bg {
  width:100%;
  background:#ddd;
  border-radius:10px;
  height:12px;
  margin-top:5px;
}

.progress-bar-fill {
  height:100%;
  background:#667eea;
  border-radius:10px;
  transition:0.3s;
}

/* tarefas */
.task {
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  color:#000;
  transition:0.2s;
}

.task:hover {
  transform: scale(1.02);
}

body.dark .task {
  background:#2a2a2a;
  color:#fff;
}

/* estados */
.task.done {
  background:#d4edda;
  color:#155724;
}

body.dark .task.done {
  background:#1f3d2b;
  color:#8bc34a;
}

.task.overdue {
  background:#f8d7da;
  color:#721c24;
}

body.dark .task.overdue {
  background:#4a1f1f;
  color:#ff8a80;
}

/* texto */
.task-text {
  display:block;
  font-size:16px;
  margin-bottom:8px;
}

/* data */
.task small {
  display:block;
  margin-bottom:10px;
  color:#555;
}

body.dark .task small {
  color:#bbb;
}

/* ações */
.actions {
  display:flex;
  gap:10px;
}

a {
  text-decoration:none;
  cursor:pointer;
}

/* responsivo */
@media (max-width:500px) {
  input, button {
    width:100%;
    margin-bottom:8px;
  }

  .actions {
    justify-content:space-between;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <a href="/logout">Sair</a>
  <span onclick="toggleTheme()">🌙</span>
</div>

<h2>Tarefas</h2>

<!-- 📊 PROGRESSO -->
<div class="progress-container">
  <strong>Progresso: {{ progress }}%</strong>

  <div class="progress-bar-bg">
    <div class="progress-bar-fill" style="width: {{ progress }}%;"></div>
  </div>

  <small>{{ done }} de {{ total }} concluídas</small>
</div>

<!-- 🔎 BUSCA -->
<input type="text" id="search" placeholder="Buscar tarefa..." onkeyup="searchTask()">

<!-- 🔽 ORDENAÇÃO -->
<form method="GET">
  <label>Ordenar por:</label>
  <select name="order" onchange="this.form.submit()">
    <option value="default">Padrão</option>
    <option value="date" {% if order == 'date' %}selected{% endif %}>📅 Data</option>
    <option value="name" {% if order == 'name' %}selected{% endif %}>🔤 Nome</option>
    <option value="done" {% if order == 'done' %}selected{% endif %}>✅ Status</option>
  </select>
</form>

<!-- ➕ NOVA TAREFA -->
<form method="POST" action="/add">
  <input name="title" placeholder="Nova tarefa..." required>
  <input type="date" name="deadline">
  <button type="submit">+</button>
</form>

<!-- 📋 LISTA -->
{% for task in tasks %}
<div class="task 
{% if task.done %}done{% endif %}
{% if task.deadline and not task.done and task.deadline < now %}overdue{% endif %}
">

<span class="task-text">{{ task.title }}</span>

{% if task.deadline %}
<small>📅 {{ task.deadline.strftime('%d/%m/%Y') }}</small>
{% endif %}

<div class="actions">
  <a href="/edit/{{ task.id }}">✏️</a>
  <a href="/done/{{ task.id }}">✔</a>
  <a onclick="confirmDelete({{ task.id }})">❌</a>
</div>

</div>
{% endfor %}

</div>

<script>
// tema
window.onload = function() {
  const theme = localStorage.getItem("theme");
  document.body.classList.add(theme === "dark" ? "dark" : "light");
};

function toggleTheme(){
  const body = document.body;

  if (body.classList.contains("dark")) {
    body.classList.replace("dark","light");
    localStorage.setItem("theme","light");
  } else {
    body.classList.replace("light","dark");
    localStorage.setItem("theme","dark");
  }
}

// alerta deletar
function confirmDelete(id){
  Swal.fire({
    title: 'Tem certeza?',
    text: "Essa tarefa será deletada!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e74c3c',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'Sim, deletar',
    cancelButtonText: 'Cancelar'
  }).then((result) => {
    if (result.isConfirmed) {
      window.location.href = '/delete/' + id;
    }
  });
}

// busca
function searchTask() {
  let input = document.getElementById("search").value.toLowerCase();
  let tasks = document.querySelectorAll(".task");

  tasks.forEach(task => {
    let text = task.querySelector(".task-text").innerText.toLowerCase();
    task.style.display = text.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
