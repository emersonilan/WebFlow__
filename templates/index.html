<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- 🔥 SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
  font-family: Arial;
  margin:0;
  padding:10px;
}

body.light {
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: #000;
}

body.dark {
  background:#121212;
  color:#e0e0e0;
}

.container {
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}

body.dark .container {
  background:#1e1e1e;
}

.task {
  background:#f5f5f5;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  color:#000;
}

body.dark .task {
  background:#2a2a2a;
  color:#ffffff;
}

.task.done {
  background:#d4edda;
  color:#155724;
}

body.dark .task.done {
  background:#1f3d2b;
  color:#8bc34a;
}

.task.overdue {
  background:#f8d7da;
  color:#721c24;
}

body.dark .task.overdue {
  background:#4a1f1f;
  color:#ff8a80;
}

.task small {
  color:#555;
}

body.dark .task small {
  color:#bbb;
}

input {
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  margin-bottom:8px;
}

body.dark input {
  background:#333;
  color:white;
  border:none;
}

button {
  padding:10px;
  border:none;
  border-radius:8px;
  background:#667eea;
  color:white;
  cursor:pointer;
}

a {
  margin-left:5px;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
}

select {
  padding:8px;
  border-radius:8px;
  margin-left:10px;
}
</style>
</head>

<body>

<div class="container">

<div style="display:flex; justify-content:space-between;">
<a href="/logout">Sair</a>
<span onclick="toggleTheme()">🌙</span>
</div>

<h2>Tarefas</h2>

<!-- 🔎 BUSCA -->
<input type="text" id="search" placeholder="Buscar tarefa..." onkeyup="searchTask()">

<!-- 🔽 ORDENAÇÃO -->
<form method="GET" style="margin-bottom:15px;">
  <label>Ordenar por:</label>

  <select name="order" onchange="this.form.submit()">
    <option value="default">Padrão</option>
    <option value="date" {% if order == 'date' %}selected{% endif %}>📅 Data</option>
    <option value="name" {% if order == 'name' %}selected{% endif %}>🔤 Nome</option>
    <option value="done" {% if order == 'done' %}selected{% endif %}>✅ Status</option>
  </select>
</form>

<!-- ➕ NOVA TAREFA -->
<form method="POST" action="/add">
  <input name="title" placeholder="Nova tarefa..." required>
  <input type="date" name="deadline">
  <button type="submit">+</button>
</form>

<!-- 📋 LISTA -->
{% for task in tasks %}
<div class="task 
{% if task.done %}done{% endif %}
{% if task.deadline and not task.done and task.deadline < now %}overdue{% endif %}
">

<strong class="task-text">{{ task.title }}</strong>

{% if task.deadline %}
<br><small>📅 {{ task.deadline.strftime('%d/%m/%Y') }}</small>
{% endif %}

<div>
  <a href="/edit/{{ task.id }}">✏️</a>
  <a href="/done/{{ task.id }}">✔</a>
  <a onclick="confirmDelete({{ task.id }})">❌</a>
</div>

</div>
{% endfor %}

</div>

<script>
// 🌙 tema
window.onload = function() {
  const theme = localStorage.getItem("theme");

  if (theme === "dark") {
    document.body.classList.add("dark");
  } else {
    document.body.classList.add("light");
  }
};

function toggleTheme(){
  const body = document.body;

  if (body.classList.contains("dark")) {
    body.classList.remove("dark");
    body.classList.add("light");
    localStorage.setItem("theme", "light");
  } else {
    body.classList.remove("light");
    body.classList.add("dark");
    localStorage.setItem("theme", "dark");
  }
}

// 🔥 ALERTA BONITO
function confirmDelete(id){
  Swal.fire({
    title: 'Tem certeza?',
    text: "Essa tarefa será deletada!",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e74c3c',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'Sim, deletar',
    cancelButtonText: 'Cancelar'
  }).then((result) => {
    if (result.isConfirmed) {
      window.location.href = '/delete/' + id;
    }
  });
}

// 🔎 BUSCA EM TEMPO REAL
function searchTask() {
  let input = document.getElementById("search").value.toLowerCase();
  let tasks = document.querySelectorAll(".task");

  tasks.forEach(task => {
    let text = task.querySelector(".task-text").innerText.toLowerCase();

    if (text.includes(input)) {
      task.style.display = "block";
    } else {
      task.style.display = "none";
    }
  });
}
</script>

</body>
</html>
