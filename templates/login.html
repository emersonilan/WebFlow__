<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    /* 🌞 MODO CLARO */
    body.light {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    /* 🌙 MODO ESCURO */
    body.dark {
      background: #121212;
      color: white;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      transition: 0.3s;
    }

    body.dark .container {
      background: #1e1e1e;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    body.dark input {
      background: #333;
      color: white;
      border: none;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    a {
      display: block;
      margin-top: 10px;
      color: #667eea;
      text-decoration: none;
    }

    .error {
      color: red;
      margin-top: 10px;
      font-size: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .toggle {
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>

<body class="light">

<div class="container">

  <!-- 🌙 BOTÃO MODO ESCURO -->
  <div class="top-bar">
    <span class="toggle" onclick="toggleTheme()">🌙</span>
  </div>

  <h2>🔐 Login</h2>

  <form method="POST">
    <input name="username" placeholder="Usuário" required>
    <input name="password" type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <a href="/register">Criar conta</a>

</div>

<script>
function toggleTheme() {
  const body = document.body;

  if (body.classList.contains("light")) {
    body.classList.remove("light");
    body.classList.add("dark");
    localStorage.setItem("theme", "dark");
  } else {
    body.classList.remove("dark");
    body.classList.add("light");
    localStorage.setItem("theme", "light");
  }
}

// carregar tema salvo
window.onload = () => {
  const theme = localStorage.getItem("theme");
  if (theme === "dark") {
    document.body.classList.remove("light");
    document.body.classList.add("dark");
  }
};
</script>

</body>
</html>
