<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container {
  background:#1e1e1e;
  padding:30px;
  border-radius:18px;
  width:320px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  color:white;
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

input {
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:none;
  border-radius:10px;
  background:#2a2a2a;
  color:white;
  box-sizing:border-box;
}

button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#667eea;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover {
  background:#5a6fd6;
}

a {
  display:block;
  text-align:center;
  margin-top:15px;
  color:#bbb;
  text-decoration:none;
}

a:hover {
  color:white;
}
</style>
</head>

<body>

<div class="container">

<h2>Criar conta</h2>

<form method="POST">
  <input name="username" placeholder="Usuário" required>
  <input name="password" type="password" placeholder="Senha" required>
  <button type="submit">Cadastrar</button>
</form>

<a href="/login">Já tem conta? Entrar</a>

</div>

</body>
</html>
